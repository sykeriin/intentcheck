name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pinned: tests/test_frozen.py hashes scenarios generated through the stdlib `random` module, whose
          # sampling helpers can change between minor versions.
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
